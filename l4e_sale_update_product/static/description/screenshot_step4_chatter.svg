<svg viewBox="0 0 820 260" xmlns="http://www.w3.org/2000/svg">
  <!-- Window Background -->
  <rect width="820" height="260" fill="#f8fafc"/>

  <!-- Chatter Section Container -->
  <g transform="translate(60, 20)">
    <rect width="700" height="220" rx="8" fill="#ffffff" stroke="#e2e8f0"/>

    <!-- Chatter Header Bar -->
    <rect width="700" height="42" rx="8" fill="#f1f5f9"/>
    <rect x="16" y="8" width="95" height="26" rx="4" fill="#64748b"/>
    <text x="63" y="25" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Send message</text>

    <rect x="120" y="8" width="75" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="157" y="25" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Log note</text>

    <line x1="0" y1="42" x2="700" y2="42" stroke="#e2e8f0"/>

    <!-- Chatter Message Entry -->
    <g transform="translate(20, 58)">
      <!-- Avatar -->
      <circle cx="20" cy="20" r="18" fill="#1e3a8a"/>
      <text x="20" y="25" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>

      <!-- Message Content Box -->
      <g transform="translate(50, 0)">
        <text x="0" y="16" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#0f172a">Administrator</text>
        <text x="95" y="16" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Today at 10:45 AM</text>

        <!-- Formatted Note Box -->
        <g transform="translate(0, 28)">
          <rect width="590" height="105" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>

          <text x="16" y="22" font-family="'Inter', sans-serif" font-size="12.5" font-weight="800" fill="#0f172a">Product Updated:</text>

          <text x="16" y="44" font-family="'Inter', sans-serif" font-size="12" fill="#334155">
            • <tspan font-weight="700">Previous Product:</tspan> [PROD-01] Industrial Sensor A1
          </text>

          <text x="16" y="64" font-family="'Inter', sans-serif" font-size="12" fill="#334155">
            • <tspan font-weight="700" fill="#2563eb">New Product:</tspan> <tspan font-weight="700">[PROD-02] Advanced Sensor Pro Series</tspan>
          </text>

          <text x="16" y="84" font-family="'Inter', sans-serif" font-size="12" fill="#334155">
            • <tspan font-weight="700">Quantity:</tspan> 1.0 (Unchanged)
          </text>

          <text x="240" y="84" font-family="'Inter', sans-serif" font-size="12" fill="#334155">
            • <tspan font-weight="700">Unit Price:</tspan> $ 1,000.00 (Unchanged)
          </text>
        </g>
      </g>
    </g>
  </g>
</svg>
