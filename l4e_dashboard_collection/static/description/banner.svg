<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <!-- Accent Gradients -->
    <linearGradient id="salesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="invGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="amcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <!-- Dashboard Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Decorative Grid dots -->
  <g opacity="0.08">
    <circle cx="50" cy="50" r="2" fill="#ffffff"/>
    <circle cx="100" cy="50" r="2" fill="#ffffff"/>
    <circle cx="150" cy="50" r="2" fill="#ffffff"/>
    <circle cx="50" cy="100" r="2" fill="#ffffff"/>
    <circle cx="100" cy="100" r="2" fill="#ffffff"/>
    <circle cx="150" cy="100" r="2" fill="#ffffff"/>
    <!-- Bottom Right -->
    <circle cx="1050" cy="300" r="2" fill="#ffffff"/>
    <circle cx="1100" cy="300" r="2" fill="#ffffff"/>
    <circle cx="1150" cy="300" r="2" fill="#ffffff"/>
    <circle cx="1050" cy="350" r="2" fill="#ffffff"/>
    <circle cx="1100" cy="350" r="2" fill="#ffffff"/>
    <circle cx="1150" cy="350" r="2" fill="#ffffff"/>
  </g>

  <!-- Left Content Block -->
  <text x="70" y="140" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5px">L4E Dashboard Collection</text>
  <text x="70" y="180" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#60a5fa">All-In-One Business Command Center</text>
  <text x="70" y="215" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" fill="#9ca3af">Consolidated, real-time KPI analysis for decision makers</text>

  <!-- Badges -->
  <!-- Sales Badge -->
  <rect x="70" y="250" width="105" height="34" rx="17" fill="url(#salesGrad)" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="87" cy="267" r="5" fill="#3b82f6"/>
  <text x="100" y="272" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#93c5fd">Sales</text>

  <!-- Inventory Badge -->
  <rect x="185" y="250" width="125" height="34" rx="17" fill="url(#invGrad)" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <circle cx="202" cy="267" r="5" fill="#10b981"/>
  <text x="215" y="272" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">Inventory</text>

  <!-- Financials Badge -->
  <rect x="320" y="250" width="130" height="34" rx="17" fill="url(#finGrad)" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <circle cx="337" cy="267" r="5" fill="#f59e0b"/>
  <text x="350" y="272" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#fcd34d">Financials</text>

  <!-- AMC Badge -->
  <rect x="460" y="250" width="100" height="34" rx="17" fill="url(#amcGrad)" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1"/>
  <circle cx="477" cy="267" r="5" fill="#8b5cf6"/>
  <text x="490" y="272" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#c084fc">AMC</text>

  <!-- Right Side Dashboard Mockup -->
  <g transform="translate(680, 50)">
    <!-- Dashboard Browser Frame -->
    <rect width="450" height="300" rx="12" fill="url(#cardBg)" stroke="#374151" stroke-width="2" filter="drop-shadow(0 20px 25px rgba(0,0,0,0.5))"/>
    
    <!-- Title Bar -->
    <rect width="450" height="35" rx="12" fill="#111827" stroke="#374151" stroke-width="0.5"/>
    <circle cx="20" cy="17.5" r="5" fill="#ef4444"/>
    <circle cx="36" cy="17.5" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="17.5" r="5" fill="#10b981"/>
    <text x="225" y="22" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="500">L4E Dashboards</text>

    <!-- Content Grid -->
    <!-- Sales Card (Top Left) -->
    <rect x="20" y="55" width="195" height="105" rx="8" fill="#1f2937" stroke="#3b82f6" stroke-width="1"/>
    <text x="35" y="80" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#93c5fd">Sales Dashboard</text>
    <text x="35" y="105" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#ffffff">$148,250</text>
    <path d="M 35 135 L 70 120 L 105 130 L 140 115 L 180 125" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="180" cy="125" r="3" fill="#3b82f6"/>

    <!-- Inventory Card (Top Right) -->
    <rect x="235" y="55" width="195" height="105" rx="8" fill="#1f2937" stroke="#10b981" stroke-width="1"/>
    <text x="250" y="80" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#6ee7b7">Inventory Stock</text>
    <text x="250" y="105" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#ffffff">9,240 Units</text>
    <!-- Mini Stock Bar Graph -->
    <rect x="250" y="125" width="20" height="20" rx="2" fill="#10b981" opacity="0.6"/>
    <rect x="280" y="115" width="20" height="30" rx="2" fill="#10b981" opacity="0.8"/>
    <rect x="310" y="120" width="20" height="25" rx="2" fill="#10b981" opacity="0.7"/>
    <rect x="340" y="110" width="20" height="35" rx="2" fill="#10b981"/>

    <!-- Accounting Card (Bottom Left) -->
    <rect x="20" y="175" width="195" height="105" rx="8" fill="#1f2937" stroke="#f59e0b" stroke-width="1"/>
    <text x="35" y="200" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fcd34d">Financial Ratios</text>
    <!-- Donut/Circle indicator for Gross Margin -->
    <circle cx="150" cy="225" r="22" fill="none" stroke="#374151" stroke-width="6"/>
    <circle cx="150" cy="225" r="22" fill="none" stroke="#f59e0b" stroke-width="6" stroke-dasharray="100,138" stroke-dashoffset="0" transform="rotate(-90 150 225)"/>
    <text x="150" y="229" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" fill="#ffffff" font-weight="700" text-anchor="middle">68%</text>
    <text x="35" y="225" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af">Gross Margin</text>
    <text x="35" y="245" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af">Net Profit: <tspan fill="#ffffff" font-weight="700">24%</tspan></text>

    <!-- AMC Card (Bottom Right) -->
    <rect x="235" y="175" width="195" height="105" rx="8" fill="#1f2937" stroke="#8b5cf6" stroke-width="1"/>
    <text x="250" y="200" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#c084fc">AMC Contracts</text>
    <text x="250" y="225" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff">84 Active</text>
    <!-- Scheduled services indicator -->
    <rect x="250" y="242" width="70" height="16" rx="8" fill="#8b5cf6" opacity="0.2"/>
    <text x="285" y="254" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#c084fc" text-anchor="middle">12 Scheduled</text>
  </g>
</svg>
