<svg viewBox="0 0 820 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Window Background -->
  <rect width="820" height="280" fill="#f8fafc"/>

  <!-- Sale Order Header Summary Mockup -->
  <rect x="20" y="20" width="780" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="48" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#0f172a">S00001</text>
  <rect x="120" y="34" width="90" height="22" rx="4" fill="#dbeafe"/>
  <text x="165" y="49" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">Sales Order</text>

  <!-- Smart Buttons -->
  <rect x="610" y="30" width="80" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="650" y="48" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Delivery: 1</text>
  <rect x="700" y="30" width="80" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="740" y="48" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Invoices: 1</text>

  <!-- Order Lines Table -->
  <rect x="20" y="95" width="780" height="160" rx="8" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- Table Header -->
  <rect x="20" y="95" width="780" height="36" fill="#f1f5f9" rx="8"/>
  <text x="40" y="118" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#64748b">Product</text>
  <text x="240" y="118" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#64748b">Quantity</text>
  <text x="330" y="118" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#64748b">Delivered</text>
  <text x="430" y="118" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#64748b">Unit Price</text>
  <text x="540" y="118" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#64748b">Taxes</text>
  <text x="630" y="118" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#64748b">Subtotal</text>
  <text x="730" y="118" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#3b82f6">Action</text>

  <!-- Table Row 1 -->
  <line x1="20" y1="131" x2="800" y2="131" stroke="#e2e8f0"/>
  <text x="40" y="162" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#0f172a">[PROD-01] Industrial Sensor A1</text>
  <text x="240" y="162" font-family="'Inter', sans-serif" font-size="13" fill="#334155">1.00</text>
  <text x="330" y="162" font-family="'Inter', sans-serif" font-size="13" fill="#334155">0.00</text>
  <text x="430" y="162" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#0f172a">$ 1,000.00</text>
  <text x="540" y="162" font-family="'Inter', sans-serif" font-size="13" fill="#64748b">15%</text>
  <text x="630" y="162" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#0f172a">$ 1,150.00</text>

  <!-- Update Product Button Highlight -->
  <g transform="translate(720, 145)">
    <rect x="-6" y="-6" width="38" height="38" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
    <!-- Exchange Icon -->
    <path d="M 6 10 h 14 m -4 -4 l 4 4 l -4 4 M 20 18 h -14 m 4 -4 l -4 4 l 4 4" stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Pointer Tag -->
  <g transform="translate(620, 195)">
    <rect width="170" height="32" rx="6" fill="#1e293b"/>
    <text x="85" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">👆 Click to Update Product</text>
  </g>
</svg>
