<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- Node Gradient 1 -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Node Gradient 2 -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Node Gradient 3 -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Decorative Dotted Grid (Top-left & Bottom-right) -->
  <g opacity="0.12">
    <circle cx="60" cy="50" r="2.5" fill="#fff"/>
    <circle cx="110" cy="50" r="2.5" fill="#fff"/>
    <circle cx="160" cy="50" r="2.5" fill="#fff"/>
    <circle cx="60" cy="100" r="2.5" fill="#fff"/>
    <circle cx="110" cy="100" r="2.5" fill="#fff"/>
    <circle cx="160" cy="100" r="2.5" fill="#fff"/>
    <circle cx="60" cy="150" r="2.5" fill="#fff"/>
    <circle cx="110" cy="150" r="2.5" fill="#fff"/>
    <circle cx="160" cy="150" r="2.5" fill="#fff"/>

    <circle cx="1020" cy="280" r="2.5" fill="#fff"/>
    <circle cx="1070" cy="280" r="2.5" fill="#fff"/>
    <circle cx="1120" cy="280" r="2.5" fill="#fff"/>
    <circle cx="1020" cy="330" r="2.5" fill="#fff"/>
    <circle cx="1070" cy="330" r="2.5" fill="#fff"/>
    <circle cx="1120" cy="330" r="2.5" fill="#fff"/>
    <circle cx="1020" cy="380" r="2.5" fill="#fff"/>
    <circle cx="1070" cy="380" r="2.5" fill="#fff"/>
    <circle cx="1120" cy="380" r="2.5" fill="#fff"/>
  </g>

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="200" cy="180" r="140" fill="#3b82f6" opacity="0.08" filter="blur(40px)"/>
  <circle cx="950" cy="200" r="160" fill="#10b981" opacity="0.08" filter="blur(40px)"/>

  <!-- ================= LEFT COLUMN: HERO HEADLINE & BADGES ================= -->
  <!-- Top Tag -->
  <g transform="translate(70, 52)">
    <rect width="195" height="28" rx="14" fill="#3b82f6" opacity="0.2" stroke="#3b82f6" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="4" fill="#60a5fa"/>
    <text x="28" y="19" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="0.5">SALES &amp; INVENTORY SYNC</text>
  </g>

  <!-- Main Title -->
  <text x="70" y="130" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.8">
    Sale Update Product
  </text>

  <!-- Subtitle -->
  <text x="70" y="170" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#93c5fd">
    Update Product on Confirmed Orders with Zero Pricing Discrepancies
  </text>

  <!-- Description paragraph -->
  <text x="70" y="208" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#cbd5e1">
    Safely replace order line products while keeping agreed prices, quantities, taxes &amp; discounts intact.
  </text>
  <text x="70" y="230" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#94a3b8">
    Automatically synchronizes open delivery orders, reserves stock &amp; updates customer invoices.
  </text>

  <!-- Feature Pills / Badges -->
  <g transform="translate(70, 265)">
    <!-- Pill 1: Preserves Price & Qty -->
    <rect x="0" y="0" width="185" height="34" rx="17" fill="#3b82f6" opacity="0.18" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="92" y="22" font-family="'Inter', sans-serif" font-size="12.5" font-weight="700" fill="#93c5fd" text-anchor="middle">✔ Fixed Price &amp; Qty</text>

    <!-- Pill 2: Auto Stock Sync -->
    <rect x="195" y="0" width="175" height="34" rx="17" fill="#10b981" opacity="0.18" stroke="#10b981" stroke-width="1.2"/>
    <text x="282" y="22" font-family="'Inter', sans-serif" font-size="12.5" font-weight="700" fill="#6ee7b7" text-anchor="middle">⚡ Auto Stock Sync</text>

    <!-- Pill 3: Invoice Sync -->
    <rect x="380" y="0" width="150" height="34" rx="17" fill="#8b5cf6" opacity="0.18" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="455" y="22" font-family="'Inter', sans-serif" font-size="12.5" font-weight="700" fill="#c4b5fd" text-anchor="middle">🧾 Invoices Sync</text>
  </g>

  <!-- Stat highlight line -->
  <g transform="translate(70, 325)">
    <text x="0" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#64748b">
      COMPATIBLE WITH:
    </text>
    <rect x="125" y="7" width="75" height="24" rx="6" fill="#334155"/>
    <text x="162" y="23" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">COMMUNITY</text>

    <rect x="208" y="7" width="85" height="24" rx="6" fill="#334155"/>
    <text x="250" y="23" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">ENTERPRISE</text>

    <rect x="300" y="7" width="70" height="24" rx="6" fill="#1e3a8a"/>
    <text x="335" y="23" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#60a5fa" text-anchor="middle">ODOO.SH</text>
  </g>


  <!-- ================= RIGHT COLUMN: INTERACTIVE WORKFLOW GRAPHIC ================= -->
  <g transform="translate(770, 45)">
    <!-- Connecting dashed flow line -->
    <path d="M 35 60 L 35 145 L 35 235" stroke="#3b82f6" stroke-width="3" stroke-dasharray="6,6" opacity="0.4"/>

    <!-- Step 1 Card: Confirmed Sale Order -->
    <g transform="translate(0, 15)" filter="url(#cardShadow)">
      <rect width="360" height="68" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <rect width="360" height="68" rx="14" fill="#1e293b" opacity="0.6"/>
      <!-- Icon badge -->
      <circle cx="35" cy="34" r="18" fill="url(#blueGrad)"/>
      <!-- Order Document Icon -->
      <path d="M 29 26 h 8 l 5 5 v 13 h -13 z M 37 26 v 5 h 5" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
      <!-- Content -->
      <text x="68" y="29" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Confirmed Sales Order</text>
      <text x="68" y="48" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Order locked &amp; delivery order created</text>
    </g>

    <!-- Step 2 Card: 1-Click Update Product Button -->
    <g transform="translate(0, 105)" filter="url(#cardShadow)">
      <rect width="360" height="68" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="1.8"/>
      <rect width="360" height="68" rx="14" fill="#1e293b" opacity="0.75"/>
      <!-- Icon badge -->
      <circle cx="35" cy="34" r="18" fill="url(#purpleGrad)"/>
      <!-- Exchange Icon -->
      <path d="M 27 30 h 14 m -3 -3 l 3 3 l -3 3 M 43 38 h -14 m 3 -3 l -3 3 l 3 3" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Content -->
      <text x="68" y="29" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#c4b5fd">1-Click "Update Product" Wizard</text>
      <text x="68" y="48" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Pick replacement · Price &amp; Qty untouched</text>
    </g>

    <!-- Step 3 Card: Auto-Synchronized Stock & Invoices -->
    <g transform="translate(0, 195)" filter="url(#cardShadow)">
      <rect width="360" height="68" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <rect width="360" height="68" rx="14" fill="#1e293b" opacity="0.6"/>
      <!-- Icon badge -->
      <circle cx="35" cy="34" r="18" fill="url(#emeraldGrad)"/>
      <!-- Checkmark Icon -->
      <path d="M 28 34 l 5 5 l 10 -11" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Content -->
      <text x="68" y="29" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#6ee7b7">Auto-Synchronized Deliveries</text>
      <text x="68" y="48" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Unreserves stock, updates moves &amp; invoices</text>
    </g>
  </g>
</svg>
