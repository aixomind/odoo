<svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Modal Backdrop -->
  <rect width="820" height="320" fill="#0f172a" opacity="0.35"/>

  <!-- Modal Dialog -->
  <g transform="translate(140, 20)">
    <rect width="540" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="drop-shadow(0 25px 25px rgba(0,0,0,0.15))"/>

    <!-- Modal Header -->
    <rect width="540" height="50" rx="12" fill="#f8fafc"/>
    <text x="24" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#0f172a">Update Product</text>
    <text x="510" y="32" font-family="'Inter', sans-serif" font-size="18" fill="#94a3b8" cursor="pointer">×</text>
    <line x1="0" y1="50" x2="540" y2="50" stroke="#e2e8f0"/>

    <!-- Explanatory Notice -->
    <rect x="24" y="65" width="492" height="38" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="40" y="88" font-family="'Inter', sans-serif" font-size="12" fill="#1e40af">
      💡 Replace the product on this line. Agreed quantity and unit price will remain untouched.
    </text>

    <!-- Field: Current Product -->
    <text x="24" y="130" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#64748b">Current Product</text>
    <rect x="24" y="140" width="492" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="36" y="164" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#475569">[PROD-01] Industrial Sensor A1</text>
    <rect x="420" y="147" width="85" height="24" rx="4" fill="#e2e8f0"/>
    <text x="462" y="163" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">ReadOnly</text>

    <!-- Field: New Product -->
    <text x="24" y="202" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#0f172a">New Replacement Product *</text>
    <rect x="24" y="212" width="492" height="38" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.8"/>
    <text x="36" y="236" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#0284c7">[PROD-02] Advanced Sensor Pro Series</text>
    <text x="495" y="235" font-family="'Inter', sans-serif" font-size="12" fill="#64748b">▼</text>

    <!-- Modal Footer -->
    <line x1="0" y1="262" x2="540" y2="262" stroke="#e2e8f0"/>
    <rect x="24" y="272" width="130" height="34" rx="6" fill="#2563eb"/>
    <text x="89" y="294" font-family="'Inter', sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Update Product</text>

    <rect x="165" y="272" width="80" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="205" y="294" font-family="'Inter', sans-serif" font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">Cancel</text>
  </g>
</svg>
