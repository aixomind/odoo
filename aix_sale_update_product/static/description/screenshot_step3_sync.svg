<svg viewBox="0 0 820 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Window Background -->
  <rect width="820" height="280" fill="#f8fafc"/>

  <!-- Success Notification Bar -->
  <g transform="translate(20, 15)">
    <rect width="780" height="42" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="25" cy="21" r="10" fill="#10b981"/>
    <path d="M 21 21 l 3 3 l 6 -7" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="46" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#065f46">Success:</text>
    <text x="110" y="26" font-family="'Inter', sans-serif" font-size="13" fill="#047857">Successfully updated 1 product line on S00001. Delivery order and invoices synchronized.</text>
  </g>

  <!-- Dual Cards for Delivery & Invoices -->
  <g transform="translate(20, 72)">
    <!-- Left Card: Delivery Order Operations -->
    <g transform="translate(0, 0)">
      <rect width="380" height="190" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <rect width="380" height="36" rx="8" fill="#f8fafc"/>
      <text x="18" y="23" font-family="'Inter', sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">📦 Delivery Order: WH/OUT/00001</text>
      <rect x="295" y="8" width="70" height="20" rx="4" fill="#dcfce7"/>
      <text x="330" y="22" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#15803d" text-anchor="middle">Ready</text>

      <line x1="0" y1="36" x2="380" y2="36" stroke="#e2e8f0"/>
      <text x="18" y="65" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#64748b">Stock Move Updated to New Product:</text>
      <text x="18" y="88" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#0f172a">[PROD-02] Advanced Sensor Pro</text>

      <rect x="18" y="105" width="344" height="65" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="30" y="125" font-family="'Inter', sans-serif" font-size="11.5" fill="#475569">✔ Old stock unreserved: <tspan font-weight="700">1.00 Unit</tspan></text>
      <text x="30" y="145" font-family="'Inter', sans-serif" font-size="11.5" fill="#475569">✔ New stock re-reserved: <tspan font-weight="700" fill="#16a34a">1.00 Unit Available</tspan></text>
      <text x="30" y="162" font-family="'Inter', sans-serif" font-size="10.5" fill="#64748b">Detailed operations &amp; pickings synced</text>
    </g>

    <!-- Right Card: Customer Invoice -->
    <g transform="translate(400, 0)">
      <rect width="380" height="190" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <rect width="380" height="36" rx="8" fill="#f8fafc"/>
      <text x="18" y="23" font-family="'Inter', sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">🧾 Customer Invoice: INV/2026/00001</text>
      <rect x="295" y="8" width="70" height="20" rx="4" fill="#eff6ff"/>
      <text x="330" y="22" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#1e40af" text-anchor="middle">Synced</text>

      <line x1="0" y1="36" x2="380" y2="36" stroke="#e2e8f0"/>
      <text x="18" y="65" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#64748b">Invoice Line Product Updated:</text>
      <text x="18" y="88" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#0f172a">[PROD-02] Advanced Sensor Pro</text>

      <rect x="18" y="105" width="344" height="65" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="30" y="125" font-family="'Inter', sans-serif" font-size="11.5" fill="#475569">✔ Quantity: <tspan font-weight="700">1.00</tspan> (Unchanged)</text>
      <text x="30" y="145" font-family="'Inter', sans-serif" font-size="11.5" fill="#475569">✔ Unit Price: <tspan font-weight="700">$ 1,000.00</tspan> (Unchanged)</text>
      <text x="30" y="162" font-family="'Inter', sans-serif" font-size="10.5" fill="#64748b">Subtotal &amp; tax calculations 100% preserved</text>
    </g>
  </g>
</svg>
