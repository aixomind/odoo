<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- decorative dotted grid -->
  <g opacity="0.08">
    <circle cx="80" cy="60" r="2" fill="#fff"/>
    <circle cx="140" cy="60" r="2" fill="#fff"/>
    <circle cx="200" cy="60" r="2" fill="#fff"/>
    <circle cx="80" cy="120" r="2" fill="#fff"/>
    <circle cx="140" cy="120" r="2" fill="#fff"/>
    <circle cx="200" cy="120" r="2" fill="#fff"/>
    <circle cx="1000" cy="320" r="2" fill="#fff"/>
    <circle cx="1060" cy="320" r="2" fill="#fff"/>
    <circle cx="1120" cy="320" r="2" fill="#fff"/>
    <circle cx="1000" cy="360" r="2" fill="#fff"/>
    <circle cx="1060" cy="360" r="2" fill="#fff"/>
    <circle cx="1120" cy="360" r="2" fill="#fff"/>
  </g>

  <!-- Left text block -->
  <text x="70" y="150" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff">Custom Approval Workflow</text>
  <text x="70" y="188" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="500" fill="#93c5fd">Dynamic Approval Engine for Odoo</text>
  <text x="70" y="225" font-family="Inter, Arial, sans-serif" font-size="15" fill="#cbd5e1">Any Model · Any Field · Any Condition · Zero Code</text>

  <rect x="70" y="255" width="150" height="34" rx="17" fill="#3b82f6" opacity="0.15" stroke="#3b82f6"/>
  <text x="145" y="277" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#93c5fd" text-anchor="middle">Sale Orders</text>

  <rect x="235" y="255" width="170" height="34" rx="17" fill="#10b981" opacity="0.15" stroke="#10b981"/>
  <text x="320" y="277" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7" text-anchor="middle">Purchase Orders</text>

  <rect x="420" y="255" width="150" height="34" rx="17" fill="#f59e0b" opacity="0.15" stroke="#f59e0b"/>
  <text x="495" y="277" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#fcd34d" text-anchor="middle">Invoices</text>

  <!-- Right side: approval flow illustration -->
  <g transform="translate(700,60)">
    <!-- connecting line -->
    <path d="M 60 60 L 60 140 L 60 220 L 60 280" stroke="#3b82f6" stroke-width="3" stroke-dasharray="6,6" opacity="0.5"/>

    <!-- Node 1: Rule triggered -->
    <rect x="0" y="20" width="220" height="60" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="30" cy="50" r="14" fill="url(#cardGrad)"/>
    <text x="30" y="55" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">1</text>
    <text x="55" y="46" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Rule Triggered</text>
    <text x="55" y="64" font-family="Inter, Arial, sans-serif" font-size="11" fill="#94a3b8">Field / condition matched</text>

    <!-- Node 2: Approver notified -->
    <rect x="0" y="120" width="220" height="60" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="30" cy="150" r="14" fill="url(#cardGrad)"/>
    <text x="30" y="155" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">2</text>
    <text x="55" y="146" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Approver Notified</text>
    <text x="55" y="164" font-family="Inter, Arial, sans-serif" font-size="11" fill="#94a3b8">DM + Email alert</text>

    <!-- Node 3: Approved -->
    <rect x="0" y="220" width="220" height="60" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="30" cy="250" r="14" fill="#10b981"/>
    <path d="M 24 250 l 4 5 l 9 -10" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="55" y="246" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Approved &amp; Logged</text>
    <text x="55" y="264" font-family="Inter, Arial, sans-serif" font-size="11" fill="#94a3b8">Record auto-validated</text>
  </g>
</svg>
